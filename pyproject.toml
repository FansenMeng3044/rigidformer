[project]
name = "rigidformer"
version = "0.2.0"
description = "Implementation of Rigidformer"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'rigid dynamics',
    'attention mechanisms'
]

classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.10',
]

dependencies = [
    "einx>=0.4.0",
    "einops>=0.8.1",
    "roma",
    "taylor-series-linear-attention>=0.1.10",
    "torch>=2.5",
    "torch-einops-utils>=0.1.19",
    "x-mlps-pytorch",
]

[project.urls]
Homepage = "https://pypi.org/project/rigidformer/"
Repository = "https://github.com/FansenMeng3044/rigidformer"

[project.scripts]
rigidformer-train = "rigidformer.train:main"

[project.optional-dependencies]
examples = [
    "box2d-py",
    "fire",
    "matplotlib",
    "numpy",
    "pandas",
    "seaborn",
]

test = [
    "pytest",
    "scipy",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "rigidformer",
    "pyproject.toml",
    "README.md",
    "LICENSE"
]

[tool.hatch.build.targets.wheel]
packages = ["rigidformer"]
